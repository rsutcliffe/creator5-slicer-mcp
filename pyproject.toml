[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creator5-slicer-mcp"
version = "0.1.0"
description = "MCP server that slices models for the Flashforge Creator 5 with OrcaSlicer, choosing quality, strength and filament settings for you."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
creator5-slicer-mcp = "creator5_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/creator5_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
